name: Test & build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Rebuild sample maps (must match committed JSON)
        run: npm run build:maps && git diff --exit-code www/maps
      - run: npm test

  apk:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          # The legacy "tools" package (the action's default) no longer exists
          # in current cmdline-tools; Gradle fetches the platform/build-tools.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - name: Copy web app into the Android project
        run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: riftforge-arcade-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
